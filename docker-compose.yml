services:
  qdrant:
    image: qdrant/qdrant:v1.16.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      RAG_QDRANT_URL: http://qdrant:6333
      RAG_REDIS_URL: redis://redis:6379/0
      RAG_DATA_DIR: /app/data
      RAG_ADMIN_USERNAME: ${RAG_ADMIN_USERNAME:-korce}
      RAG_ADMIN_PASSWORD: ${RAG_ADMIN_PASSWORD:-change-me}
      RAG_JWT_SECRET: ${RAG_JWT_SECRET:-change-me-in-production}
      RAG_GENERATION_API_KEY: ${RAG_GENERATION_API_KEY:-}
      RAG_GENERATION_BASE_URL: ${RAG_GENERATION_BASE_URL:-https://api.deepseek.com}
      RAG_GENERATION_MODEL: ${RAG_GENERATION_MODEL:-deepseek-chat}
      RAG_EMBEDDING_API_KEY: ${RAG_EMBEDDING_API_KEY:-}
      RAG_EMBEDDING_BASE_URL: ${RAG_EMBEDDING_BASE_URL:-https://api.siliconflow.cn/v1}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-BAAI/bge-m3}
      RAG_EMBEDDING_DIM: ${RAG_EMBEDDING_DIM:-1024}
      RAG_RERANK_API_KEY: ${RAG_RERANK_API_KEY:-}
      RAG_RERANK_BASE_URL: ${RAG_RERANK_BASE_URL:-https://api.siliconflow.cn/v1}
      RAG_RERANK_MODEL: ${RAG_RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
    volumes:
      - app_data:/app/data

volumes:
  qdrant_data:
  redis_data:
  app_data:



