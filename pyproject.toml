[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-knowledge-base"
version = "3.0.0"
description = "Enterprise RAG knowledge base"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136,<1",
    "uvicorn>=0.48,<1",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.14,<3",
    "openai>=2.41,<3",
    "numpy>=2.4,<3",
    "jieba>=0.42,<1",
    "python-docx>=1.2,<2",
    "pdfplumber>=0.11,<1",
    "python-multipart>=0.0.20,<1",
    "httpx>=0.28,<1",
    "pyyaml>=6.0,<7",
    "redis>=5.2,<7",
    "qdrant-client>=1.14,<2",
    "pyjwt>=2.10,<3",
    "openpyxl>=3.1,<4",
    "pytest>=8.3,<9",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9,<1",
    "locust>=2.32,<3",
    "pre-commit>=4,<5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
